<!DOCTYPE html>
<html>

<head>
    <title>Urfehden Karte</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
    <header class="p-6">
        <h1 class="text-4xl font-extrabold leading-none">Urfehden Karte</h1>
    </header>
    <main class="m-6">
        <div class="imwrapper">
            <img src="data/KgrWuerttemberg.png" usemap="#cities" class="map" />
            <div id="dots"></div>
        </div>

        <map name="cities" id="citiesmap">
        </map>

        <div id="info" class="p-6 pt-0">
            <div class="flex mb-6">
                <input autocomplete="off" id="search" type="text"
                    class="mr-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Stadt suchen">
                <button id="clear" type="button"
                    class="h-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Löschen</button>

            </div>
            <div class="uflist pt-6 pr-6">
            </div>
        </div>
    </main>
</body>
<script type="text/javascript" src="index.js"></script>

</html>
